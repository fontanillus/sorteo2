<!DOCTYPE html>
<!-- Archivo principal de la pagina. Define la estructura visible del sorteo. -->
<html lang="es">

<head>
    <!-- Configuracion basica del documento y de la vista responsive. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo</title>
    <!-- Favicon de la pagina: icono pequeño que aparece en la pestana del navegador. -->
    <link rel="icon" type="image/svg+xml" href="./img/favicon.svg">
    <!-- Tailwind CSS permite aplicar estilos usando clases directamente en el HTML. -->
    <script src="https://cdn.tailwindcss.com"></script>
    </head>


<!-- Cuerpo de la pagina: centra el contenido y aplica el fondo oscuro. -->
<body class="bg-[#111827] min-h-screen flex items-center justify-center px-4 py-6">
    <!-- Contenedor principal de la aplicacion del sorteo. -->
    <main class="w-full max-w-md bg-[#23272e] rounded-lg shadow-lg p-6 flex flex-col gap-4 border-4 border-yellow-500 mx-auto">
        <!-- Titulo, explicacion del ejercicio y requisitos que se deben mostrar. -->
        <h1 class="text-2xl md:text-3xl font-bold text-[#d4af37] mb-2 text-center drop-shadow">Evaluación por pares</h1>
        <p class="text-base md:text-lg text-yellow-100 mb-4 text-center">Hacer un programa que permita asignar a cada integrante de la clase, un compañero al cual se le deberá revisar el Dashboard de repaso de funciones.</p>
        <h2 class="text-lg md:text-xl font-semibold text-[#ffd700] mb-2">El programa deberá:</h2>
        <!-- Lista de datos que debe mostrar cada revision. -->
        <ul class="list-disc list-inside space-y-1 text-[#fff8dc]">
            <li>revisor</li>
            <li>revisado</li>
            <li>repositorio</li>
            <li>mostrar resultado</li>
        </ul>
        <!-- Zona del boton que inicia el sorteo desde JavaScript. -->
        <div class="flex justify-center mt-4">
            <!-- El id btn-sorteo permite encontrar este boton en sorteo.js. -->
            <button id="btn-sorteo" class="bg-[#d4af37] hover:bg-yellow-400 text-black font-semibold py-2 px-6 rounded-lg shadow-lg hover:shadow-xl hover:scale-105 transition-all duration-300 w-full md:w-auto border-2 border-[#bfa14a]">
                Ejecutar sorteo
            </button>
        </div>
        <!-- Aqui se escriben los resultados generados por mostrarRevisiones. -->
        <div id="resultado" class="mt-4 text-center text-[#ffd700] font-bold"></div>
    </main>
    <!-- Primero se carga libreria.js porque contiene las funciones reutilizables. -->
    <script src="./js/libreria.js"></script>
    <!-- Despues se carga sorteo.js, que usa la libreria y conecta el boton. -->
    <script src="./js/sorteo.js"></script>
</body>

</html>
